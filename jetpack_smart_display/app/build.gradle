plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.compose)
}

android {
    namespace "com.smsoft.smartdisplay"
    compileSdk 37

    defaultConfig {
        applicationId "com.smsoft.smartdisplay"
        minSdk 26
        targetSdk 37
        versionCode 5
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ksp {
            arg('room.schemaLocation', "$projectDir/schemas")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        buildTypes.each {
            Properties properties = new Properties()
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
            it.buildConfigField 'String', 'OWM_API_KEY', properties.getProperty('OWM_API_KEY')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        // AGP 9 removed the global android.defaults.buildfeatures.buildconfig gradle.properties
        // flag; buildConfig must now be opted into per-module since this module uses
        // buildConfigField (OWM_API_KEY).
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.lifecycle.runtime.compose

    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.androidx.hilt.navigation.compose
    implementation libs.androidx.navigation.compose

    implementation libs.accompanist.permissions

    implementation libs.androidx.media
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.ui
    implementation libs.androidx.media3.exoplayer.rtsp
    implementation libs.androidx.media3.session

    implementation libs.libvlc.all

    implementation libs.composeprefs
    implementation libs.androidx.datastore.preferences

    implementation libs.godaddy.color.picker
    implementation libs.godaddy.color.picker.android

    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler

    implementation libs.androidx.legacy.support.v4
    implementation libs.paho.mqtt.android

    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.hilt.work
    ksp libs.androidx.hilt.compiler

    implementation libs.retrofit.converter.moshi
    implementation libs.moshi.kotlin
    ksp libs.moshi.kotlin.codegen

    implementation libs.coil.compose

    // "@aar" forces the aar artifact type and isn't expressible via the libs.xxx accessor,
    // so these two keep manual GAV notation but still pull their version from the catalog.
    implementation "net.java.dev.jna:jna:${libs.versions.jna.get()}@aar"
    implementation "com.alphacephei:vosk-android:${libs.versions.voskAndroid.get()}@aar"
    implementation project(":models")

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}
